// Android 工程共享的构建插件和依赖仓库。

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    if (project.name != 'app') {
        layout.buildDirectory.set(new File(rootProject.projectDir, "build-libraries/${project.name}"))
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
