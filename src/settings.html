<!doctype html>
<!-- 桌面专属设置页面，由隔离的本地窗口加载。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>MemeMeow · 桌面设置</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings-renderer.js" defer></script>
</head>
<body>
  <header><img src="../assets/icon.png" width="46" height="46" alt=""><div><h1>桌面设置</h1><p>仅保存在当前电脑</p></div></header>
  <form id="settings-form">
    <fieldset id="controls" disabled>
      <section>
        <label class="option"><input id="open-at-login" type="checkbox">登录系统后自动启动</label>
        <p id="login-hint">启动后在后台运行，可从托盘或菜单栏显示窗口。</p>
      </section>
      <section>
        <label class="option"><input id="run-in-background" type="checkbox">关闭窗口后继续在后台运行</label>
        <p>后台运行时仍可使用快捷键。从托盘或菜单栏选择“退出”结束程序。</p>
      </section>
      <section>
        <label class="option"><input id="shortcut-enabled" type="checkbox">启用唤出窗口快捷键</label>
        <label class="shortcut-label" for="shortcut">快捷键</label>
        <div class="shortcut-row"><input id="shortcut" readonly aria-describedby="shortcut-hint" placeholder="点击后按下组合键"><button id="restore-shortcut" type="button">恢复默认</button></div>
        <p id="shortcut-hint">点击输入框后按下组合键。客户端运行时，可从其他应用唤出窗口。</p>
      </section>
      <footer><button id="save" type="submit">保存设置</button></footer>
    </fieldset>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</body>
</html>
